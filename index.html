<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehedi Internet - Live TV</title>
  
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />

  <style>
    :root {
      --primary: #ff6600; /* Premium Orange */
      --primary-dark: #cc5200;
      --bg-dark: #0f0f11;
      --card-bg: #1a1a1e;
      --card-hover: #26262c;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* Header Section */
    .header {
      background: linear-gradient(135deg, #1f1f24, #0f0f11);
      border-bottom: 3px solid var(--primary);
      text-align: center;
      padding: 20px 15px;
      box-shadow: 0 4px 15px rgba(255, 102, 0, 0.2);
    }

    .header h1 {
      margin: 0;
      color: var(--primary);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
    }

    .header p {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .main-container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 12px;
    }

    /* Player Styling */
    .player-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 102, 0, 0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      margin-bottom: 20px;
    }

    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
    }

    .vjs-default-skin .vjs-big-play-button {
      background-color: rgba(255, 102, 0, 0.8) !important;
      border-color: var(--primary) !important;
      border-radius: 50% !important;
      width: 2em !important;
      height: 2em !important;
      line-height: 2em !important;
      margin-left: -1em !important;
      margin-top: -1em !important;
    }

    .now-playing {
      background: #24242b;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 2px solid var(--primary);
    }

    .now-playing-dot {
      height: 10px;
      width: 10px;
      background-color: var(--primary);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Search Bar */
    .search-container {
      margin-bottom: 20px;
    }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
    }

    /* Channel Grid */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .channel-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid #2a2a30;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .channel-card:hover {
      background: var(--card-hover);
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 6px 15px rgba(255, 102, 0, 0.3);
    }

    .channel-card.active {
      border-color: var(--primary);
      background: #28221e;
    }

    .channel-card h4 {
      margin: 0;
      font-size: 13px;
      color: #fff;
      font-weight: 600;
      word-break: break-word;
    }

    /* Fixed Bottom Footer */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #16161a;
      border-top: 2px solid var(--primary);
      padding: 12px 20px;
      text-align: center;
      z-index: 999;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.8);
    }

    .footer-text {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .footer-text span {
      color: var(--primary);
    }

    .call-btn {
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
    }

    .call-btn:hover {
      background: var(--primary-dark);
    }

    @media (max-width: 600px) {
      .channel-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px;
      }
      .channel-card {
        padding: 10px 5px;
      }
      .channel-card h4 {
        font-size: 12px;
      }
      .footer-bar {
        flex-direction: row;
        padding: 10px;
      }
      .footer-text {
        font-size: 13px;
      }
      .call-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>MEHEDI INTERNET</h1>
    <p>Premium BDIX Live TV Streaming Service</p>
  </div>

  <div class="main-container">
    <!-- Player Card -->
    <div class="player-card">
      <video id="tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
        <source src="https://tvsen6.aynaott.com/4XcqdovJzbbC9WdJA9gk/index.m3u8" type="application/x-mpegURL">
      </video>
      <div class="now-playing">
        <span class="now-playing-dot"></span>
        <span id="channel-title">বর্তমানে চলছে: Somoy News</span>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-container">
      <input type="text" id="search" class="search-box" placeholder="আপনার পছন্দের চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
    </div>

    <!-- Channel Cards Grid -->
    <div class="channel-grid" id="channel-list">
      
      <div class="channel-card active" onclick="changeChannel(this, 'https://tvsen6.aynaott.com/4XcqdovJzbbC9WdJA9gk/index.m3u8', 'Somoy News')">
        <h4>Somoy News</h4>
      </div>

      <div class="channel-card" onclick="changeChannel(this, 'https://tvsen5.aynaott.com/TnMn5kZz8aLm/index.m3u8', 'T Sports')">
        <h4>T Sports</h4>
      </div>

      <div class="channel-card" onclick="changeChannel(this, 'https://app.ncare.live/c3VydmVyX8RpbEU9Mi8xNy8yMDE0GIDU6RgzQ6NTAgdEoaeFzbF92YWxIZTO0U0ezN1IzMyfvcGVMZEJCTEFWeVN3PTOmdFsaWRtaW51aiPhnPTI2/gazibdz.stream/live-orgin/gazibdz.stream/playlist.m3u8', 'Gazi TV')">
        <h4>Gazi TV</h4>
      </div>

      <div class="channel-card" onclick="changeChannel(this, 'YOUR_JAMUNA_M3U8_URL', 'Jamuna TV')">
        <h4>Jamuna TV</h4>
      </div>

      <div class="channel-card" onclick="changeChannel(this, 'YOUR_NAGORIK_M3U8_URL', 'Nagorik TV')">
        <h4>Nagorik TV</h4>
      </div>

      <div class="channel-card" onclick="changeChannel(this, 'YOUR_CHANNELI_M3U8_URL', 'Channel i')">
        <h4>Channel i</h4>
      </div>

    </div>
  </div>

  <!-- Bottom Floating Bar -->
  <div class="footer-bar">
    <div class="footer-text">
      <span>Mehedi Internet</span> Live TV
    </div>
    <a href="tel:01626886070" class="call-btn">
      📞 Call: 01626886070
    </a>
  </div>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
  <script>
    // Video.js Player Initialization
    var player = videojs('tv-player', {
      autoplay: false,
      controls: true,
      responsive: true,
      fluid: true
    });

    // Function to handle Channel Switching
    function changeChannel(element, m3u8Url, channelName) {
      // Active Border CSS Toggle
      var cards = document.getElementsByClassName('channel-card');
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('active');
      }
      if (element) {
        element.classList.add('active');
      }

      // Update Header Status
      document.getElementById('channel-title').innerText = "বর্তমানে চলছে: " + channelName;

      // Update Source & Play Video safely
      player.src({
        src: m3u8Url,
        type: 'application/x-mpegURL'
      });
      
      player.ready(function() {
        var promise = player.play();
        if (promise !== undefined) {
          promise.catch(function(error) {
            console.log("Autoplay was prevented by browser:", error);
          });
        }
      });
    }

    // Live Search Filter Function
    function filterChannels() {
      var input = document.getElementById('search').value.toLowerCase();
      var cards = document.getElementsByClassName('channel-card');

      for (var i = 0; i < cards.length; i++) {
        var title = cards[i].getElementsByTagName('h4')[0].innerText.toLowerCase();
        if (title.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  </script>

</body>
</html>
