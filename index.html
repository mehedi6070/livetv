<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV Player</title>
  
  <!-- HLS.js for Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 9999px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .main-container {
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .main-container {
        flex-direction: row;
      }
    }

    .video-section {
      flex: 2;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-info-bar {
      width: 100%;
      padding: 1rem;
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #334155;
    }

    .channel-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .sidebar {
      flex: 1;
      background-color: #0f172a;
      border-left: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 70px);
    }

    .category-tabs {
      display: flex;
      overflow-x: auto;
      background-color: #1e293b;
      padding: 0.5rem;
      gap: 0.5rem;
    }

    .tab-btn {
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 0.375rem;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      align-content: start;
    }

    .channel-card {
      background-color: #1e293b;
      border-radius: 0.5rem;
      padding: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .channel-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .channel-card.active {
      border-color: #0284c7;
      background-color: #1e293b;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
    }

    .channel-card img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 50%;
      background-color: #334155;
    }

    .channel-card span {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      background: rgba(0,0,0,0.8);
      padding: 1rem;
      border-radius: 8px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-tv"></i> Live TV Portal
    </div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
    </div>
  </header>

  <div class="main-container">
    <!-- Video Player Section -->
    <div class="video-section">
      <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay muted></video>
        <div id="errorMessage" class="error-msg">
          <i class="fa-solid fa-triangle-exclamation"></i><br>
          স্ট্রিম চালু করা যাচ্ছে না। অনুগ্রহ করে অন্য চ্যানেল চেষ্টা করুন।
        </div>
      </div>
      <div class="channel-info-bar">
        <div class="channel-title" id="currentChannelName">চ্যানেল নির্বাচন করুন</div>
      </div>
    </div>

    <!-- Sidebar with Categories & Channels -->
    <div class="sidebar">
      <div class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">সবগুলো</button>
        <button class="tab-btn" onclick="filterCategory('news', this)">সংবাদ</button>
        <button class="tab-btn" onclick="filterCategory('entertainment', this)">বিনোদন</button>
        <button class="tab-btn" onclick="filterCategory('infotainment', this)">ইনফোটেইনমেন্ট</button>
      </div>

      <div class="channel-list" id="channelGrid">
        <!-- Dynamic Channels Will Be Loaded Here -->
      </div>
    </div>
  </div>

  <script>
    // সক্রিয় M3U8 স্ট্রিম লিঙ্কসমূহের তালিকা
    const channels = [
      {
        id: "1",
        name: "Aaj Tak HD",
        category: "news",
        logo: "https://aajtaklive.vgcdn.net/v1/manifest/611d79b11b77e2f571934fd80ca1413453772ac7/77d58608-05b2-409b-be79-ffe09e76fcc9/a5ea3249-e10c-4e37-8f6d-4391f55961de/4.m3u8",
        url: "https://aajtaklive.vgcdn.net/v1/manifest/611d79b11b77e2f571934fd80ca1413453772ac7/77d58608-05b2-409b-be79-ffe09e76fcc9/a5ea3249-e10c-4e37-8f6d-4391f55961de/4.m3u8"
      },
      {
        id: "2",
        name: "India Today",
        category: "news",
        logo: "https://feeds.intoday.in/hltapps/api/master.m3u8",
        url: "https://feeds.intoday.in/hltapps/api/master.m3u8"
      },
      {
        id: "3",
        name: "YRF Music",
        category: "entertainment",
        logo: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01412-xiaomiasia-yrfmusic-xiaomi/playlist.m3u8",
        url: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01412-xiaomiasia-yrfmusic-xiaomi/playlist.m3u8"
      },
      {
        id: "4",
        name: "Bollywood Movies",
        category: "entertainment",
        logo: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg00864-shemarooenterta-shemabollywood-ono/playlist.m3u8",
        url: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg00864-shemarooenterta-shemabollywood-ono/playlist.m3u8"
      },
      {
        id: "5",
        name: "9XM Music",
        category: "entertainment",
        logo: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/9xm/23886666-8fc5-470f-aab1-bd637ed607b1/3.m3u8",
        url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/9xm/23886666-8fc5-470f-aab1-bd637ed607b1/3.m3u8"
      },
      {
        id: "6",
        name: "NASA TV",
        category: "infotainment",
        logo: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",
        url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8"
      }
    ];

    let hls = null;
    const video = document.getElementById('videoPlayer');
    const errorMessage = document.getElementById('errorMessage');

    // প্লেয়ার লোড এবং চ্যানেল প্লে করার ফাংশন
    function playChannel(url, name, element) {
      document.getElementById('currentChannelName').innerText = name;
      errorMessage.style.display = 'none';

      // Active Class পরিচালনা
      document.querySelectorAll('.channel-card').forEach(card => card.classList.remove('active'));
      if(element) element.classList.add('active');

      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls({
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 3
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            showError();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play().catch(() => {});
        });
      } else {
        showError();
      }
    }

    function showError() {
      errorMessage.style.display = 'block';
    }

    // চ্যানেল কার্ডসমূহ তৈরি করা
    function renderChannels(items) {
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = '';
      
      if(items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">কোনো চ্যানেল পাওয়া যায়নি</p>';
        return;
      }

      items.forEach(channel => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playChannel(channel.url, channel.name, card);
        card.innerHTML = `
          <img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/50?text=TV'">
          <span>${channel.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    // ক্যাটাগরি ফিল্টার
    function filterCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (cat === 'all') {
        renderChannels(channels);
      } else {
        const filtered = channels.filter(c => c.category === cat);
        renderChannels(filtered);
      }
    }

    // সার্চ ফিল্টার
    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
      renderChannels(filtered);
    }

    // প্রাথমিক অবস্থা
    window.onload = () => {
      renderChannels(channels);
      // প্রথম চ্যানেলটি স্বয়ংক্রিয়ভাবে চালু করা
      if(channels.length > 0) {
        const firstCard = document.querySelector('.channel-card');
        playChannel(channels[0].url, channels[0].name, firstCard);
      }
    };
  </script>
</body>
</html>
